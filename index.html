<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Calendar — June 2026</title>
<style>
  :root {
    --bg: #131314;
    --surface: #1e1f20;
    --surface-2: #28292b;
    --line: rgba(255, 255, 255, 0.07);
    --line-strong: rgba(255, 255, 255, 0.12);
    --text: #e3e3e3;
    --text-dim: #9aa0a6;
    --text-faint: #6f7479;
    --accent: #8ab4f8;
    --now: #ea4335;
    --hour-h: 54px;        /* height of one hour row */
    --gutter-w: 64px;      /* left time-label column width */
    --panel-w: 420px;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Google Sans", "Roboto", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    height: 60px;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 20px;
    border-bottom: 1px solid var(--line);
  }
  .topbar h1 {
    font-size: 21px;
    font-weight: 400;
    margin: 0;
    letter-spacing: .2px;
  }
  .topbar h1 b { font-weight: 500; }
  .nav { display: flex; align-items: center; gap: 4px; }
  .btn {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--line-strong);
    border-radius: 100px;
    padding: 7px 16px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
  }
  .btn:hover { background: var(--surface-2); }
  .icon-btn {
    width: 34px; height: 34px;
    display: grid; place-items: center;
    border-radius: 50%;
    background: transparent;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 18px;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }
  .spacer { flex: 1; }
  .view-pill {
    border: 1px solid var(--line-strong);
    border-radius: 100px;
    padding: 7px 16px;
    color: var(--text-dim);
    font-size: 13px;
  }

  /* ---------- Layout shell ---------- */
  .shell { position: relative; display: flex; height: calc(100% - 60px); overflow: hidden; }
  .cal { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  /* ---------- Day header row ---------- */
  .dayhead {
    display: grid;
    grid-template-columns: var(--gutter-w) repeat(7, 1fr);
    border-bottom: 1px solid var(--line);
    padding-right: 14px; /* offset for scrollbar in grid below */
  }
  .dayhead .corner { }
  .dh {
    text-align: center;
    padding: 8px 0 6px;
    border-left: 1px solid var(--line);
  }
  .dh .dow { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .6px; }
  .dh .dnum {
    font-size: 22px;
    font-weight: 400;
    margin-top: 3px;
    width: 38px; height: 38px;
    line-height: 38px;
    border-radius: 50%;
    display: inline-block;
  }
  .dh.today .dow { color: var(--accent); }
  .dh.today .dnum { background: var(--accent); color: #18191b; font-weight: 500; }

  /* ---------- All-day row ---------- */
  .allday {
    display: grid;
    grid-template-columns: var(--gutter-w) repeat(7, 1fr);
    border-bottom: 1px solid var(--line-strong);
    min-height: 30px;
    padding-right: 14px;
  }
  .allday .label {
    font-size: 10px;
    color: var(--text-faint);
    text-align: right;
    padding: 6px 8px 0 0;
    text-transform: uppercase;
    letter-spacing: .4px;
  }
  .allday .cell {
    border-left: 1px solid var(--line);
    padding: 4px 4px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .chip {
    font-size: 11.5px;
    padding: 3px 8px;
    border-radius: 5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
    border-left: 3px solid transparent;
  }

  /* ---------- Scrollable time grid ---------- */
  .gridscroll { flex: 1; overflow-y: auto; }
  .grid {
    position: relative;
    display: grid;
    grid-template-columns: var(--gutter-w) repeat(7, 1fr);
  }
  .gutter { position: relative; }
  .hour-label {
    position: absolute;
    right: 8px;
    font-size: 10.5px;
    color: var(--text-faint);
    transform: translateY(-6px);
    white-space: nowrap;
  }
  .daycol {
    position: relative;
    border-left: 1px solid var(--line);
  }
  .hour-line {
    position: absolute;
    left: 0; right: 0;
    border-top: 1px solid var(--line);
  }
  .half-line {
    position: absolute;
    left: 0; right: 0;
    border-top: 1px dashed rgba(255,255,255,0.035);
  }

  /* ---------- Events ---------- */
  .event {
    position: absolute;
    border-radius: 6px;
    padding: 3px 7px;
    overflow: hidden;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: box-shadow .13s ease, filter .13s ease, min-width .13s ease;
    line-height: 1.2;
  }
  /* hover = "peek": lift above neighbors, widen to a readable size, reveal full title */
  .event:hover {
    min-width: 174px;
    height: auto !important;
    min-height: var(--evh);
    overflow: visible;
    z-index: 200 !important;
    filter: brightness(1.07);
    box-shadow: 0 8px 22px rgba(0,0,0,0.55);
  }
  .event:hover .e-title { -webkit-line-clamp: 8; }
  .event.selected {
    box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px #ffffff;
    z-index: 60 !important;
  }
  .event .e-title {
    font-size: 12px;
    font-weight: 500;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 3;          /* wrap up to 3 lines, then ellipsis */
    overflow: hidden;
    overflow-wrap: anywhere;        /* break long words like "Reindustrialize" */
    word-break: break-word;
  }
  .event .e-time {
    font-size: 10.5px;
    opacity: .82;
    margin-top: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* color variants */
  .c-busy   { background: rgba(123, 72, 48, 0.5);  color: #e7c3ad; border-left-color: #b06a45; }
  .c-blue   { background: #3b577f;                 color: #dce8fb; border-left-color: #6f9be0; }
  .c-lav    { background: rgba(118,116,168,0.42);  color: #d8d7f2; border-left-color: #9b98d8; }
  .c-purple { background: rgba(95,93,164,0.5);     color: #dcdbf6; border-left-color: #8f8de0; }
  .c-green  { background: rgba(58,110,79,0.42);    color: #cdebd6; border-left-color: #4caf6e; }
  .c-teal   { background: rgba(38,108,108,0.42);   color: #c6e9e9; border-left-color: #3fa6a6; }
  .c-orange { background: rgba(150,96,40,0.45);    color: #f0cfa3; border-left-color: #d28a3e; }

  /* ---------- Now line ---------- */
  .now-line {
    position: absolute;
    left: 0; right: 0;
    height: 0;
    border-top: 2px solid var(--now);
    z-index: 70;
    pointer-events: none;
  }
  .now-line::before {
    content: "";
    position: absolute;
    left: -5px; top: -6px;
    width: 11px; height: 11px;
    background: var(--now);
    border-radius: 50%;
  }
  .now-label {
    position: absolute;
    left: 6px;
    transform: translateY(-50%);
    background: var(--now);
    color: #fff;
    font-size: 10.5px;
    font-weight: 600;
    padding: 1px 6px;
    border-radius: 4px;
    z-index: 71;
    pointer-events: none;
  }

  /* ---------- Detail panel ---------- */
  /* Wide screens: panel pushes the grid (both visible, like GCal desktop). */
  .panel {
    width: var(--panel-w);
    flex-shrink: 0;
    border-left: 1px solid var(--line-strong);
    background: var(--surface);
    margin-right: calc(-1 * var(--panel-w));
    transform: translateX(100%);
    transition: margin-right .22s ease, transform .22s ease;
    overflow-y: auto;
  }
  .panel.open { margin-right: 0; transform: translateX(0); }

  /* Narrow screens: panel floats as an overlay so day columns never crush. */
  @media (max-width: 1200px) {
    .panel {
      position: absolute;
      top: 0; right: 0; bottom: 0;
      margin-right: 0;
      max-width: 88vw;
      box-shadow: -18px 0 40px rgba(0,0,0,0.45);
      z-index: 200;
    }

  .panel-inner { padding: 22px 26px 40px; }
  .panel .p-top {
    display: flex; justify-content: space-between; align-items: center;
    color: var(--text-dim);
    margin-bottom: 18px;

  .panel .p-top .lbl { font-size: 13px; }
  .panel h2 {

  .swatch { width: 13px; height: 13px; border-radius: 4px; margin-top: 7px; flex-shrink: 0; }
  .p-when { color: var(--text-dim); font-size: 14px; margin: 2px 0 22px 25px; }
  .p-row {
    display: grid; grid-template-columns: 22px 1fr;
    gap: 14px; align-items: start;
    padding: 9px 0;
    color: var(--text);
    font-size: 13.5px;

  .p-row .ic { color: var(--text-dim); font-size: 15px; line-height: 1.4; text-align: center; }
  .p-row.dim { color: var(--text-dim); }
  .p-row a { color: var(--accent); text-decoration: none; word-break: break-all; }
  .p-row a:hover { text-decoration: underline; }
  .p-sub { color: var(--text-dim); font-size: 12.5px; margin-top: 2px; }
  .p-sep { border-top: 1px solid var(--line); margin: 10px 0; }
  .p-desc { font-size: 13px; color: var(--text-dim); line-height: 1.55; white-space: pre-wrap; }
  .organizer-av {
    width: 22px; height: 22px; border-radius: 50%;
    background: #8e5bd0; color: #fff; font-size: 11px;
    display: grid; place-items: center; font-weight: 500;
  }

  /* ---------- View toggle (top-right pill) ---------- */
  .view-pill { background: transparent; cursor: pointer; font-family: inherit; }
  .view-pill:hover { background: var(--surface-2); color: var(--text); }
  .view-pill.active { background: var(--surface-2); color: var(--text); border-color: var(--line-strong); }

  /* ---------- Agenda / list view ---------- */
  .list-head { margin-bottom: 6px; }
  .list-head .lh-title { font-size: 17px; font-weight: 500; display: flex; align-items: center; gap: 9px; }
  .list-head .lh-title .count {
    font-size: 11px; color: var(--text-dim); background: var(--surface-2);
    border-radius: 100px; padding: 1px 9px; font-weight: 400;
  }
  .list-head .lh-sub { color: var(--text-dim); font-size: 12px; margin-top: 4px; }
  .day-group { margin-top: 14px; }
  .dg-head {
    font-size: 11px; text-transform: uppercase; letter-spacing: .5px;
    color: var(--text-faint); padding: 5px 2px 4px; position: sticky; top: 0;
    background: var(--surface); z-index: 2;
  }
  .list-row {
    display: grid; grid-template-columns: 10px 56px 1fr; align-items: start;
    gap: 10px; padding: 8px; border-radius: 8px; cursor: pointer;
    transition: background .1s ease;
  }
  .list-row:hover { background: var(--surface-2); }
  .list-row.active { background: rgba(138,180,248,0.16); }
  .list-row .dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 4px; }
  .list-row .lr-time { color: var(--text-dim); font-size: 11.5px; margin-top: 1px; white-space: nowrap; }
  .list-row .lr-title { font-size: 13px; line-height: 1.3; }
  .p-back {
    display: inline-flex; align-items: center; gap: 3px;
    background: transparent; border: none; color: var(--text-dim);
    font-size: 13px; cursor: pointer; font-family: inherit; padding: 0;
  }
  .p-back:hover { color: var(--text); }

  ::-webkit-scrollbar { width: 12px; height: 12px; }
  ::-webkit-scrollbar-thumb { background: #3a3b3d; border-radius: 10px; border: 3px solid var(--surface); }
  ::-webkit-scrollbar-track { background: transparent; }
  .gridscroll::-webkit-scrollbar-thumb { border-color: var(--bg); }
</style>
</head>

/* ============================================================
   Calendar constants & helpers
   ============================================================ */
const HOUR_H = 54;
const PX_PER_MIN = HOUR_H / 60;
const DOW = ["SUN","MON","TUE","WED","THU","FRI","SAT"];
const MONTHS = ["January","February","March","April","May","June","July",

// Reindustrialize 2026 week — Sunday Jun 14 → Saturday Jun 20, 2026.
const WEEK_START = new Date(2026, 5, 14);  // month index 5 = June

let viewStart = new Date(WEEK_START);

function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function sameDate(a, b){
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}
function todayInView(){
  const now = new Date();
  for (let i=0;i<7;i++) if (sameDate(addDays(viewStart, i), now)) return true;
  return false;
}
function fmtTime(mins){
  let h = Math.floor(mins/60), m = mins%60;
  const ap = h >= 12 ? "PM" : "AM";
  let hh = h % 12; if (hh === 0) hh = 12;
  return m === 0 ? `${hh} ${ap}` : `${hh}:${String(m).padStart(2,"0")} ${ap}`;
}
function fmtRange(s,e){
  const a = fmtTime(s), b = fmtTime(e % 1440);
  // drop the redundant meridiem on the start when both share it: "9 – 11 AM"
  if (a.slice(-2) === b.slice(-2)) return `${a.slice(0,-3)} – ${b}`;
  return `${a} – ${b}`;
}
// "[RI] " is on every event — strip it from the grid block so the distinguishing words lead
function blockTitle(t){ return t.replace(/^\[RI\]\s*/, ""); }
function durStr(s,e){
  const t = e - s, h = Math.floor(t/60), m = t%60;
  return [h?`${h}h`:"", m?`${m}min`:""].filter(Boolean).join(" ");
}

/* ============================================================
   Overlap layout — Google-style column packing + expansion
   ============================================================ */
function collide(a,b){ return a.start < b.end && b.start < a.end; }

function layout(events){
  const evs = [...events].sort((a,b)=> a.start-b.start || a.end-b.end);
  let columns = [], lastEnd = null;

  function flush(cols){
    const n = cols.length;
    cols.forEach((col, ci) => {
      col.forEach(ev => {
        // expand right until blocked
        let span = 1;
        for (let k = ci+1; k < n; k++){
          if (cols[k].some(e => collide(e, ev))) break;
          span++;
        }
        ev._left = ci / n;
        ev._width = span / n;
      });
    });
  }

  evs.forEach(ev => {
    if (lastEnd !== null && ev.start >= lastEnd){ flush(columns); columns = []; lastEnd = null; }
    let placed = false;
    for (const col of columns){
      if (!collide(col[col.length-1], ev)){ col.push(ev); placed = true; break; }
    }
    if (!placed) columns.push([ev]);
    lastEnd = (lastEnd === null) ? ev.end : Math.max(lastEnd, ev.end);
  });
  if (columns.length) flush(columns);
  return evs;
}

/* ============================================================
   Render
   ============================================================ */
const grid = document.getElementById("grid");
const dayhead = document.getElementById("dayhead");
const allday = document.getElementById("allday");

function sameWeekAsDemo(){ return viewStart.getTime() === WEEK_START.getTime(); }

function render(){
  // ----- Title -----
  const end = addDays(viewStart, 6);
  let titleHtml;
  if (viewStart.getMonth() === end.getMonth()){
    titleHtml = `<b>${MONTHS[viewStart.getMonth()]}</b> ${viewStart.getFullYear()}`;
  } else {
    titleHtml = `<b>${MONTHS[viewStart.getMonth()].slice(0,3)} – ${MONTHS[end.getMonth()].slice(0,3)}</b> ${end.getFullYear()}`;
  }
  document.getElementById("title").innerHTML = titleHtml;

  // ----- Day header -----
  dayhead.innerHTML = `<div class="corner"></div>`;
  for (let i=0;i<7;i++){
    const d = addDays(viewStart, i);
    const isToday = sameDate(d, new Date());
    dayhead.insertAdjacentHTML("beforeend",
      `<div class="dh ${isToday?"today":""}">
         <div class="dow">${DOW[i]}</div>
         <div class="dnum">${d.getDate()}</div>
       </div>`);
  }

  // ----- All-day row -----
  allday.innerHTML = `<div class="label">All-day</div>`;
  const adByDay = Array.from({length:7}, ()=>[]);
  if (sameWeekAsDemo()) EVENTS.filter(e=>e.allDay).forEach(e=> adByDay[e.day].push(e));
  for (let i=0;i<7;i++){
    const cell = document.createElement("div");
    cell.className = "cell";
    adByDay[i].forEach(ev=>{
      const chip = document.createElement("div");
      chip.className = `chip c-${ev.color}`;
      chip.textContent = ev.title;
      chip.onclick = (e)=>{ e.stopPropagation(); selectEvent(ev); };
      cell.appendChild(chip);
    });
    allday.appendChild(cell);
  }

  // ----- Time grid -----
  grid.innerHTML = "";
  grid.style.height = (HOUR_H * 24) + "px";

  // gutter with hour labels
  const gutter = document.createElement("div");
  gutter.className = "gutter";
  for (let h=1; h<24; h++){
    const lab = document.createElement("div");
    lab.className = "hour-label";
    lab.style.top = (h*HOUR_H) + "px";
    lab.textContent = fmtTime(h*60);
    gutter.appendChild(lab);
  }
  grid.appendChild(gutter);

  // day columns
  const timed = sameWeekAsDemo() ? EVENTS.filter(e=>!e.allDay) : [];
  for (let i=0;i<7;i++){
    const col = document.createElement("div");
    col.className = "daycol";

    for (let h=0; h<24; h++){
      const hl = document.createElement("div");
      hl.className = "hour-line"; hl.style.top = (h*HOUR_H)+"px";
      col.appendChild(hl);
      const half = document.createElement("div");
      half.className = "half-line"; half.style.top = (h*HOUR_H + HOUR_H/2)+"px";
      col.appendChild(half);
    }

    const dayEvents = layout(timed.filter(e=>e.day===i));
    dayEvents.forEach(ev=>{
      const el = document.createElement("div");
      el.className = `event c-${ev.color}` + (ev===selectedEv?" selected":"");
      ev._el = el;
      const H = Math.max(Math.min(ev.end,1440)-ev.start,18)*PX_PER_MIN - 2;
      el.style.top = (ev.start*PX_PER_MIN) + "px";
      el.style.height = H + "px";
      el.style.setProperty("--evh", H + "px");   // remembered so hover can grow but never shrink
      const gap = 3;
      el.style.left = `calc(${ev._left*100}% + ${gap}px)`;
      el.style.width = `calc(${ev._width*100}% - ${gap*2}px)`;
      el.style.zIndex = 10 + Math.round(ev._left*10);
      el.innerHTML = `<div class="e-title">${blockTitle(ev.title)}</div>`
                   + `<div class="e-time">${fmtRange(ev.start, ev.end)}</div>`;
      el.title = `${blockTitle(ev.title)} · ${fmtRange(ev.start, ev.end)}`;  // native fallback tooltip
      el.onclick = (e)=>{ e.stopPropagation(); selectEvent(ev); };
      el._ev = ev;
      col.appendChild(el);
    });

    // now line on today's column (only when the real today is in view)
    if (sameDate(addDays(viewStart, i), new Date())){
      const now = new Date();
      const mins = now.getHours()*60 + now.getMinutes();
      const line = document.createElement("div");
      line.className = "now-line"; line.style.top = (mins*PX_PER_MIN)+"px";
      col.appendChild(line);
      const lab = document.createElement("div");
      lab.className = "now-label"; lab.style.top = (mins*PX_PER_MIN)+"px";
      lab.style.left = "-58px";
      lab.textContent = fmtTime(mins).replace(" ","");
      gutter.appendChild(lab);
    }

    grid.appendChild(col);
  }
}

/* ============================================================
   Selection + detail panel
   ============================================================ */
const panel = document.getElementById("panel");
const panelInner = document.getElementById("panelInner");

let selectedEv = null;    // currently focused event (null = browsing the list)
let sidebarOpen = true;   // is the right sidebar showing
let panelMode = "list";   // "list" | "detail"
const viewToggle = document.getElementById("viewToggle");

const SWATCH = { busy:"#b06a45", blue:"#6f9be0", lav:"#9b98d8", purple:"#8f8de0",
                 green:"#4caf6e", teal:"#3fa6a6", orange:"#d28a3e" };

function dayName(i){ return DOW[i].charAt(0) + DOW[i].slice(1).toLowerCase(); }

function ensureSidebar(open){
  sidebarOpen = open;
  panel.classList.toggle("open", open);
  if (!open) viewToggle.classList.remove("active");
}

/* ---- click an event (grid OR list): focus it on the calendar + show its detail ---- */
function selectEvent(ev){
  selectedEv = ev;
  if (!sameWeekAsDemo()){           // a list item from another week → jump back first
    viewStart = new Date(WEEK_START);
    render();                        // render() re-applies the selection ring + ev._el
  } else {
    document.querySelectorAll(".event.selected").forEach(n=>n.classList.remove("selected"));
    if (ev._el) ev._el.classList.add("selected");
  }
  ensureSidebar(true);
  renderDetail(ev);
  if (!ev.allDay){
    document.getElementById("gridscroll")
      .scrollTo({ top: Math.max(0, ev.start*PX_PER_MIN - 120), behavior: "smooth" });
  }
}

/* ---- click away / back: return to the plain agenda list ---- */
function deselect(){
  selectedEv = null;
  document.querySelectorAll(".event.selected").forEach(n=>n.classList.remove("selected"));
  if (sidebarOpen) renderList();
}

/* ---- the agenda list — default state when nothing is selected ---- */
function renderList(){
  panelMode = "list";
  viewToggle.classList.add("active");
  const timed = EVENTS.filter(e=>!e.allDay);
  panelInner.innerHTML = "";

  const head = document.createElement("div");
  head.className = "list-head";
  head.innerHTML = `<div class="lh-title">All events <span class="count">${timed.length}</span></div>
                    <div class="lh-sub">Click an event to open it on the calendar</div>`;
  panelInner.appendChild(head);

  for (let i=0;i<7;i++){
    const evs = timed.filter(e=>e.day===i).sort((a,b)=> a.start-b.start || a.end-b.end);
    if (!evs.length) continue;
    const d = addDays(WEEK_START, i);
    const grp = document.createElement("div");
    grp.className = "day-group";
    const dh = document.createElement("div");
    dh.className = "dg-head";
    dh.textContent = `${dayName(i)} · ${MONTHS[d.getMonth()].slice(0,3)} ${d.getDate()}`;
    grp.appendChild(dh);
    evs.forEach(ev=>{
      const row = document.createElement("div");
      row.className = "list-row" + (ev===selectedEv ? " active" : "");
      row.innerHTML = `<span class="dot" style="background:${SWATCH[ev.color]||"#888"}"></span>
                       <span class="lr-time">${fmtTime(ev.start)}</span>
                       <span class="lr-title">${blockTitle(ev.title)}</span>`;
      row.onclick = (e)=>{ e.stopPropagation(); selectEvent(ev); };
      grp.appendChild(row);
    });
    panelInner.appendChild(grp);
  }
}

/* ---- single-event detail — shown when one event is selected ---- */
function renderDetail(ev){
  panelMode = "detail";
  viewToggle.classList.remove("active");

  const d = addDays(WEEK_START, ev.day);
  const dateLabel = `${dayName(ev.day)} ${MONTHS[d.getMonth()].slice(0,3)} ${d.getDate()}`;

  let when;
  if (ev.allDay){
    when = `All day · ${dateLabel}`;
  } else {
    const endLbl = fmtTime(ev.end % 1440)
      + (ev.end > 1440 ? ` <span style="color:var(--text-faint)">(+1 day)</span>` : "");
    when = `${fmtTime(ev.start)} <span style="color:var(--text-faint)">→</span> ${endLbl} `
         + `<span style="color:var(--text-faint)">${durStr(ev.start,ev.end)}</span><br>${dateLabel}`;
  }

  let rows = "";
  rows += `
    <div class="p-row">
      <div class="organizer-av">${ORG.split(" ").map(s=>s[0]).slice(0,1).join("")}</div>
      <div><div>${ev.organizer||ORG}</div><div class="p-sub">Organizer</div></div>
    </div>`;
  rows += `<div class="p-row dim"><div class="ic">📝</div><div>Add AI meeting notes</div></div>`;
  if (ev.location)
    rows += `<div class="p-row"><div class="ic">📍</div><div>${ev.location}</div></div>`;
  if (ev.links && ev.links.length){
    rows += `<div class="p-sep"></div>`;
    ev.links.forEach(l=>{
      const short = l.length > 46 ? l.slice(0,44)+"…" : l;
      rows += `<div class="p-row"><div class="ic">🔗</div><div><a href="${l}" target="_blank" rel="noopener">${short}</a></div></div>`;
    });
  }
  if (ev.desc){
    rows += `<div class="p-sep"></div><div class="p-row"><div class="ic">≡</div><div class="p-desc">${ev.desc}</div></div>`;
  }
  rows += `<div class="p-sep"></div>`;
  rows += `<div class="p-row"><div class="ic">📅</div><div>${ev.calEmail||CAL_EMAIL}</div></div>`;
  rows += `<div class="p-row dim"><div class="ic"></div>
             <div style="display:flex; gap:60px;">
               <span>${ev.status||"Busy"}</span><span>${ev.visibility||"Default"}</span>
             </div></div>`;
  if (ev.reminder)
    rows += `<div class="p-row dim"><div class="ic">🔔</div><div>${ev.reminder}</div></div>`;

  panelInner.innerHTML = `
    <div class="p-top">
      <button class="p-back" id="backToList">‹ All events</button>
      <button class="icon-btn" id="closePanel" title="Back to list">✕</button>
    </div>
    <h2><span class="swatch" style="background:${SWATCH[ev.color]||"#888"}"></span><span>${ev.title}</span></h2>
    <div class="p-when">${when}</div>
    ${rows}
  `;
  document.getElementById("backToList").onclick = deselect;
  document.getElementById("closePanel").onclick = deselect;
  panelInner.scrollTop = 0;
}

/* ============================================================
   Navigation
   ============================================================ */
document.getElementById("prev").onclick  = ()=>{ viewStart = addDays(viewStart,-7); render(); };
document.getElementById("next").onclick  = ()=>{ viewStart = addDays(viewStart, 7); render(); };
document.getElementById("today").onclick = ()=>{ viewStart = new Date(WEEK_START); render(); };

// "Week" pill toggles the agenda: show the compact list, or hide the sidebar to get just the calendar
viewToggle.onclick = ()=>{
  if (sidebarOpen && panelMode === "list"){ ensureSidebar(false); }
  else { ensureSidebar(true); deselect(); }   // deselect() renders the list now that the sidebar is open
};

// click anywhere on empty calendar space → deselect, back to the list
document.getElementById("gridscroll").addEventListener("click", deselect);

/* ============================================================
   Init
   ============================================================ */
render();
// scroll to ~6 AM so the early-morning side-events are visible
document.getElementById("gridscroll").scrollTop = 6 * HOUR_H;
// refresh the now-line every minute (only when today is actually in view)
setInterval(()=>{ if (todayInView()) render(); }, 60000);
// default state: nothing selected → show the whole agenda list on the side
ensureSidebar(true);
renderList();
</script>
</body>
</html>
